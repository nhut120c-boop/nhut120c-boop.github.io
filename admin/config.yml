backend:
  name: github
  repo: nhut120c-boop/nhut120c-boop.github.io
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "posts"
    label: "Case Log (Posts & Writeups)"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "post"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Tags", name: "tags", widget: "list", default: ["writeup", "ctf"]}
      - {label: "Body", name: "body", widget: "markdown", default: "{% raw %}\n\nWrite your CTF writeup or study note here...\n\n{% endraw %}"}

  - name: "projects"
    label: "Projects"
    folder: "_projects"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "post"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Tags", name: "tags", widget: "list", default: ["project"]}
      - {label: "Repo URL", name: "repo_url", widget: "string", required: false}
      - {label: "Body", name: "body", widget: "markdown", default: "Detailed project description..."}

  - name: "exhibits"
    label: "Exhibits (Certificates & CTF)"
    files:
      - label: "Exhibits List"
        name: "exhibits_data"
        file: "_data/exhibits.yml"
        fields:
          - label: "CTF Exhibits"
            name: "ctf"
            widget: "list"
            fields:
              - {label: "Event Name", name: "name", widget: "string"}
              - {label: "Type (Image / PDF)", name: "type", widget: "string"}
              - {label: "File Path (or Upload)", name: "url", widget: "file"}
              - {label: "Description", name: "desc", widget: "string"}
          - label: "Academic Exhibits"
            name: "academic"
            widget: "list"
            fields:
              - {label: "Certificate Name", name: "name", widget: "string"}
              - {label: "Type (Image / PDF)", name: "type", widget: "string"}
              - {label: "File Path (or Upload)", name: "url", widget: "file"}
              - {label: "Description", name: "desc", widget: "string"}
